[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "albert-yu/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Build each dist-able package on its own (`cargo build --package visi`) instead
# of one `cargo build --workspace` per target. `visi-python` is a cdylib, which
# x86_64-unknown-linux-musl can't produce, and a workspace build compiles every
# member whether or not dist wants an artifact from it -- `dist = false` in that
# crate's metadata only drops it from the app list, not from the build command.
precise-builds = true
# Publish jobs to run in CI. `./publish-crates` is a custom job
# (.github/workflows/publish-crates.yml) that pushes visi-core and visi to
# crates.io -- dist has no built-in crates.io publisher.
publish-jobs = ["homebrew", "./publish-crates"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
