[package]
name = "visi"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
libvisi = { path = "../libvisi" }
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

[dev-dependencies]
cfb = "0.14"
zip = { version = "2.1", default-features = false, features = ["deflate"] }

