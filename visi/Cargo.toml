[package]
name = "visi"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "A developer-friendly CLI for reading, evaluating formulas in, and updating Excel (.xlsx) files"
homepage.workspace = true
repository.workspace = true
documentation = "https://github.com/albert-yu/visi"
readme = "README.md"
keywords = ["excel", "xlsx", "spreadsheet", "cli", "formula"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
visi-core = { path = "../visi-core", version = "0.2.0" }
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

[dev-dependencies]
cfb = "0.14"
zip = { version = "2.1", default-features = false, features = ["deflate"] }

