[package]
name = "libvisi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.libvisi]
path = ".."

[[bin]]
name = "ovba_decompress"
path = "fuzz_targets/ovba_decompress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vba_import"
path = "fuzz_targets/vba_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formula_eval"
path = "fuzz_targets/formula_eval.rs"
test = false
doc = false
bench = false
