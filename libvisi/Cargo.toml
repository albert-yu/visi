[package]
name = "libvisi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
calamine = "0.26"
getrandom = "0.2"
glam = "0.29"
log = "0.4"
quick-xml = "0.36"
rand = "0.8"
rust_xlsxwriter = "0.75"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-time = "1.1"
zip = "2.1"
