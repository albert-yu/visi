[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "visi-core"
requires-python = ">=3.9"
description = "Python bindings for visi-core"
license = { text = "MIT OR Apache-2.0" }
dynamic = ["version"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
dev = [
    "lxml>=5.0",
    "maturin>=1.7",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.maturin]
module-name = "visi_core"
# Turns on the feature that is deliberately off by default in Cargo.toml, so
# that `cargo test --workspace` keeps linking. See the comment there.
features = ["pyo3/extension-module"]
