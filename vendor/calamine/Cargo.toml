# Vendored, patched copy of calamine 0.26.1 -- see PATCHES.md in this
# directory for what changed and why. Trimmed from the upstream Cargo.toml:
# examples/benches/tests aren't copied into this vendor tree (only the
# library itself is needed here), so their target entries and doc-metadata
# are dropped too.

[package]
edition = "2021"
rust-version = "1.73"
name = "calamine"
version = "0.26.1"
authors = ["Johann Tuffe <tafia973@gmail.com>"]
description = "An Excel/OpenDocument Spreadsheets reader and deserializer in pure rust"
license = "MIT"
repository = "https://github.com/tafia/calamine"

[lib]
name = "calamine"
path = "src/lib.rs"

[dependencies.byteorder]
version = "1.5"

[dependencies.chrono]
version = "0.4"
features = ["serde"]
optional = true
default-features = false

[dependencies.codepage]
version = "0.1.1"

[dependencies.encoding_rs]
version = "0.8"

[dependencies.log]
version = "0.4"

[dependencies.quick-xml]
version = "0.31"
features = ["encoding"]

[dependencies.serde]
version = "1.0"

[dependencies.zip]
version = "2"
features = ["deflate"]
default-features = false

[features]
dates = ["chrono"]
default = []
picture = []
