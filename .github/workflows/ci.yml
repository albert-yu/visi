name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        env:
          PYO3_NO_PYTHON: 1
        run: cargo clippy --workspace --all-targets --features visi-python/extension-module -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: cargo test
        run: cargo test --workspace --exclude visi-python

  python:
    name: bindings + parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: python

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create a virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Python deps
        run: pip install -r fuzz/requirements.txt

      - name: Build the bindings and the CLI
        run: |
          maturin develop -m visi-python/Cargo.toml --release
          cargo build --release -p visi

      - name: Check the harness is actually wired up
        run: |
          python -c "import visi_core; visi_core.Workbook()"
          test -x target/release/visi

      - name: pytest
        run: pytest fuzz/test_backend_parity.py fuzz/test_comparator.py visi-python/tests/
