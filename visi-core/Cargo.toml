[package]
name = "visi-core"
# Deliberately independent of the workspace version: `visi` is already
# released at 0.1.x, but `visi-core` is a new name on crates.io with no
# prior releases, so it starts its own line at 0.1.0.
version = "0.2.6"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Embeddable spreadsheet engine: Excel formula compilation and evaluation, dependency-tracked recalculation, and .xlsx import/export"
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/visi-core"
readme = "README.md"
keywords = ["excel", "xlsx", "spreadsheet", "formula", "ooxml"]
categories = ["parser-implementations", "encoding", "data-structures"]

[features]
default = []
# For `wasm32-unknown-unknown` in a browser: routes `getrandom` through the JS
# crypto API. Enable this only from a final binary -- getrandom's backend is a
# global choice, so a library that turns it on forces it on every consumer.
wasm = ["getrandom/js"]

[dependencies]
calamine = "0.36"
cfb = "0.14"
getrandom = "0.2"
libm = "0.2"
log = "0.4"
quick-xml = "0.41"
rand = "0.8"
regex = "1"
rust_xlsxwriter = "0.98"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-time = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1"
